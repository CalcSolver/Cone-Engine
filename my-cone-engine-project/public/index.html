<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cone Engine - Double C* Scripting</title>
    <style>
        body { background: #111; color: white; text-align: center; font-family: sans-serif; }
        canvas { border: 2px solid #00c8ff; background: #1e1e23; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Cone Engine Web Runtime</h1>
    <canvas id="gameCanvas" width="640" height="480"></canvas>

    <!-- Load Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyCzsTF-kiR_jCOJMLfonV6BNemreeT7v-g",
          authDomain: "cone-engine.firebaseapp.com",
          projectId: "cone-engine",
          storageBucket: "cone-engine.firebasestorage.app",
          messagingSenderId: "733009087130",
          appId: "1:733009087130:web:a097a8ab7285a2058bed23",
          measurementId: "G-MF9Q67FKHJ"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
    </script>

    <!-- Engine & Compiler Scripts -->
    <script src="dc-compiler.js"></script>
    <script src="cone-engine.js"></script>
    <script>
        async function boot() {
            const engine = new ConeEngine('gameCanvas');

            // Load .dc* script file
            const response = await fetch('player.dc*');
            const dcScript = await response.text();

            // Compile Double C* to executable scope
            const compiledFn = DoubleCCompiler.compile(dcScript);
            const scriptScope = compiledFn(engine);

            // Setup Entity & ECS
            const player = new Entity("Player");
            player.addComponent(new Transform(300, 220));
            player.addComponent(new ScriptComponent(scriptScope));

            if (scriptScope.on_start) scriptScope.on_start();

            engine.addEntity(player);
            engine.start();
        }
        boot();
    </script>
</body>
</html>
