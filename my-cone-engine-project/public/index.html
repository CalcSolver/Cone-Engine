<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cone Engine Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h2>Cone Engine Platform</h2>
        <nav>
            <button onclick="switchTab('play')">Play Games</button>
            <button onclick="switchTab('create')">Double C* Studio</button>
        </nav>
    </header>

    <!-- Games Browser Tab -->
    <main id="tab-play" class="tab-content active">
        <h3>Community Creations</h3>
        <div id="game-grid" class="grid"></div>
    </main>

    <!-- Double C* Studio Editor Tab -->
    <main id="tab-create" class="tab-content">
        <div class="editor-layout">
            <div class="code-panel">
                <h3>Script Editor (.dc*)</h3>
                <textarea id="code-editor" spellcheck="false">
entity Player {
    var speed = 6

    on start {
        print "Double C* Engine Ready!"
    }

    on update {
        if key W { move(0, -speed) }
        if key S { move(0, speed) }
        if key A { move(-speed, 0) }
        if key D { move(speed, 0) }
    }
}
                </textarea>
                <div class="controls">
                    <button onclick="runScript()">Run Preview</button>
                    <button onclick="publishGame()">Publish Game</button>
                </div>
            </div>
            <div class="preview-panel">
                <h3>Canvas Viewport</h3>
                <canvas id="gameCanvas" width="500" height="400"></canvas>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js" type="module"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js" type="module"></script>
    <script src="dc-compiler.js"></script>
    <script src="cone-engine.js"></script>
    <script src="app.js" type="module"></script>
</body>
</html>
