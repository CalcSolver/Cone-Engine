<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolyEngine 3D Studio</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Import map tells the browser exactly where to load Three.js modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="ui-container">
    <div id="toolbar" class="panel">
      <div class="logo">POLYENGINE 3D</div>
      <div class="btn-group">
        <button id="add-mesh-btn">+ Add Object</button>
        <button id="save-btn">💾 Save Project</button>
        <button id="play-btn">▶ Play Game</button>
      </div>
      <div id="status-bar">Engine status: Ready</div>
    </div>

    <div id="hierarchy" class="panel">
      <div class="panel-title">Scene Hierarchy</div>
      <ul id="tree-view"></ul>
    </div>

    <div id="timeline" class="panel">
      <div class="panel-title">Console Output</div>
      <div id="console-log">[Engine] System initialized. Click an object or add one.</div>
    </div>

    <div id="inspector" class="panel">
      <div class="panel-title">Object Inspector</div>
      <div id="inspector-content">Select an object to inspect.</div>
    </div>
  </div>

  <canvas id="viewport"></canvas>

  <script type="module" src="app.js"></script>
</body>
</html>
