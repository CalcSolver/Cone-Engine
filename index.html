<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolyEngine 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background-color: #1a1a1a;
      color: #fff;
    }
    #ui-layer {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px;
      border-radius: 8px;
    }
    #status {
      font-size: 14px;
      margin-bottom: 8px;
    }
    button {
      background: #007acc;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #005999;
    }
    #game-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }
  </style>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui-layer">
    <div id="status">Status: Initializing...</div>
    <button id="load-btn">Load Project</button>
  </div>

  <canvas id="game-canvas"></canvas>

  <!-- Firebase App & Firestore (v9 Modular via CDN) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // Your Firebase Configuration (Replace values as needed)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const statusEl = document.getElementById("status");
    let scene, camera, renderer, cube;
    let isGameRunning = false;

    // Fallback default project data if cloud load fails
    function getDefaultProjectData() {
      return {
        bgColor: 0x202020,
        cubeColor: 0x00ff00,
        name: "Local Offline Scene"
      };
    }

    // Initialize/Run Game Engine
    function initGameEngine(data) {
      if (isGameRunning) return;
      isGameRunning = true;

      const canvas = document.getElementById("game-canvas");
      scene = new THREE.Scene();
      scene.background = new THREE.Color(data.bgColor || 0x111111);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const geometry = new THREE.BoxGeometry();
      const material = new THREE.MeshBasicMaterial({ color: data.cubeColor || 0x00ff00, wireframe: true });
      cube = new THREE.Mesh(geometry, material);
      scene.add(cube);

      function animate() {
        requestAnimationFrame(animate);
        cube.rotation.x += 0.01;
        cube.rotation.y += 0.01;
        renderer.render(scene, camera);
      }
      animate();

      statusEl.textContent = `Running: ${data.name}`;
    }

    // Main Load Function with Error Catching
    async function loadProject(projectId) {
      statusEl.textContent = "Loading project...";
      try {
        let user = auth.currentUser;
        if (!user) {
          const userCred = await signInAnonymously(auth);
          user = userCred.user;
        }

        const projectRef = doc(db, "users", user.uid, "projects", projectId);
        const projectSnap = await getDoc(projectRef);

        if (projectSnap.exists()) {
          initGameEngine(projectSnap.data());
        } else {
          console.warn("Project not found. Launching local backup.");
          initGameEngine(getDefaultProjectData());
        }
      } catch (error) {
        console.error("Error loading project from cloud:", error);
        statusEl.textContent = "Cloud load failed. Playing offline scene.";
        initGameEngine(getDefaultProjectData());
      }
    }

    // Setup event listeners
    document.getElementById("load-btn").addEventListener("click", () => {
      loadProject("default_project");
    });

    // Auto-start on load
    loadProject("default_project");

    window.addEventListener("resize", () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
