<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolyEngine 3D Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { width: 100vw; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; }
    #viewport { width: 100vw; height: 100vh; display: block; }
    
    /* Studio Layout Overlay */
    #ui-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: grid; grid-template-columns: 260px 1fr 300px; grid-template-rows: 40px 1fr 200px; }
    .panel { background: rgba(24, 24, 24, 0.92); backdrop-filter: blur(8px); border: 1px solid #2a2a2a; pointer-events: auto; display: flex; flex-direction: column; z-index: 10; }
    
    /* Top Toolbar */
    #toolbar { grid-column: 1 / 4; grid-row: 1; flex-direction: row; align-items: center; justify-content: space-between; padding: 0 16px; background: #1a1a1a; }
    .logo { font-weight: bold; font-size: 14px; letter-spacing: 1px; color: #007acc; }
    .btn-group { display: flex; gap: 8px; }
    button { background: #282828; border: 1px solid #3a3a3a; color: #eee; padding: 5px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; transition: 0.15s; }
    button:hover { background: #007acc; border-color: #007acc; }
    
    /* Scene Hierarchy (Left) */
    #hierarchy { grid-column: 1; grid-row: 2; padding: 12px; }
    .panel-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 10px; }
    #tree-view { flex: 1; overflow-y: auto; list-style: none; }
    .tree-node { padding: 6px 8px; font-size: 13px; border-radius: 4px; cursor: pointer; margin-bottom: 2px; }
    .tree-node:hover, .tree-node.selected { background: #007acc; }

    /* Inspector (Right) */
    #inspector { grid-column: 3; grid-row: 2 / 4; padding: 12px; }
    .prop-group { margin-bottom: 12px; }
    .prop-row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 12px; }
    input[type="number"], input[type="text"] { width: 60px; background: #111; border: 1px solid #333; color: #fff; padding: 4px; border-radius: 3px; font-size: 11px; text-align: center; }

    /* Timeline / Console (Bottom) */
    #timeline { grid-column: 1 / 3; grid-row: 3; padding: 12px; border-top: 1px solid #2a2a2a; }
    #status-bar { font-size: 11px; color: #aaa; font-family: monospace; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="ui-container">
    <div id="toolbar" class="panel">
      <div class="logo">POLYENGINE 3D</div>
      <div class="btn-group">
        <button id="add-mesh-btn">+ Add Object</button>
        <button id="save-btn">Save Project</button>
        <button id="play-btn" style="background:#28a745;">▶ Play</button>
      </div>
      <div id="status-bar">Engine status: Ready</div>
    </div>

    <div id="hierarchy" class="panel">
      <div class="panel-title">Scene Graph</div>
      <ul id="tree-view"></ul>
    </div>

    <div id="timeline" class="panel">
      <div class="panel-title">Console Output</div>
      <div id="console-log" style="font-family: monospace; font-size: 11px; color: #888;">[Engine] System initialized.</div>
    </div>

    <div id="inspector" class="panel">
      <div class="panel-title">Object Inspector</div>
      <div id="inspector-content">Select a node in the scene tree.</div>
    </div>
  </div>

  <canvas id="viewport"></canvas>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const logEl = document.getElementById("console-log");
    const statusEl = document.getElementById("status-bar");
    const treeEl = document.getElementById("tree-view");

    function log(msg) { logEl.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`; }

    // Engine Core Setup
    let scene, camera, renderer, controls;
    let sceneObjects = [];
    let selectedObject = null;
    let currentUser = null;

    function initEngine() {
      const canvas = document.getElementById("viewport");
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1e1e1e);

      const grid = new THREE.GridHelper(50, 50, 0x007acc, 0x333333);
      scene.add(grid);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(10, 20, 15);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x404040));

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 10);

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      function renderLoop() {
        requestAnimationFrame(renderLoop);
        controls.update();
        renderer.render(scene, camera);
      }
      renderLoop();
    }

    // Firebase Sync Logic
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        statusEl.textContent = `User: ${user.uid.slice(0, 6)}...`;
        await loadOrCreateProject(user.uid);
      } else {
        await signInAnonymously(auth).catch(err => {
          log("Firebase auth error: " + err.message);
        });
      }
    });

    async function loadOrCreateProject(uid) {
      const projectRef = doc(db, "users", uid, "projects", "default_project");
      try {
        const snap = await getDoc(projectRef);
        if (snap.exists()) {
          log("Project loaded from Firestore.");
          buildSceneFromData(snap.data().nodes || []);
        } else {
          log("Creating default scene structure in Firestore...");
          const initialData = { nodes: [{ name: "Main Light", type: "Light" }] };
          await setDoc(projectRef, initialData);
          buildSceneFromData(initialData.nodes);
        }
      } catch (e) {
        log("Database sync failed. Engine running local mode.");
      }
    }

    function buildSceneFromData(nodes) {
      treeEl.innerHTML = "";
      nodes.forEach((nodeData, idx) => {
        const li = document.createElement("li");
        li.className = "tree-node";
        li.innerText = `${nodeData.name} (${nodeData.type})`;
        treeEl.appendChild(li);
      });
    }

    document.getElementById("add-mesh-btn").addEventListener("click", () => {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(),
        new THREE.MeshStandardMaterial({ color: 0x007acc })
      );
      mesh.position.set(Math.random() * 4 - 2, 0.5, Math.random() * 4 - 2);
      scene.add(mesh);
      sceneObjects.push(mesh);
      
      const li = document.createElement("li");
      li.className = "tree-node";
      li.innerText = `Entity_${sceneObjects.length} (Mesh)`;
      treeEl.appendChild(li);
      log(`Added Entity_${sceneObjects.length} to scene.`);
    });

    document.getElementById("save-btn").addEventListener("click", async () => {
      if (!currentUser) return;
      statusEl.textContent = "Saving...";
      const projectRef = doc(db, "users", currentUser.uid, "projects", "default_project");
      const nodesData = sceneObjects.map((obj, i) => ({
        name: `Entity_${i + 1}`,
        type: "Mesh",
        position: [obj.position.x, obj.position.y, obj.position.z]
      }));
      await setDoc(projectRef, { nodes: nodesData }, { merge: true });
      statusEl.textContent = "Project saved to cloud.";
      log("Saved scene payload successfully.");
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    initEngine();
  </script>
</body>
</html>
