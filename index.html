<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PolyEngine 3D</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: sans-serif;
    }
    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.8);
      padding: 10px;
      border-radius: 6px;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="overlay">
    <div id="status">Connecting to Firebase...</div>
  </div>

  <canvas id="game-canvas"></canvas>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // Replace with your Firebase config values
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const statusEl = document.getElementById("status");

    let scene, camera, renderer, playerMesh;

    // Standard default scene object
    const defaultProjectData = {
      projectName: "Main Game Scene",
      playerColor: 0x00ff00,
      bgColor: 0x1a1a1a,
      createdAt: new Date().toISOString()
    };

    // Authenticate user anonymously to guarantee read/write access
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        statusEl.textContent = "User authenticated. Loading project...";
        await initializeUserCollectionAndLoad(user.uid);
      } else {
        try {
          await signInAnonymously(auth);
        } catch (err) {
          console.error("Auth error:", err);
          statusEl.textContent = "Auth failed. Booting local game...";
          runGame(defaultProjectData);
        }
      }
    });

    // Check, create collection/doc if missing, then load project
    async function initializeUserCollectionAndLoad(userId) {
      const projectDocRef = doc(db, "users", userId, "projects", "default_project");

      try {
        const docSnap = await getDoc(projectDocRef);

        if (!docSnap.exists()) {
          statusEl.textContent = "Collection missing. Creating new project in Firebase...";
          // Automatically creates the 'users' and sub-collection 'projects' in Firestore
          await setDoc(projectDocRef, defaultProjectData);
          statusEl.textContent = "Collection created! Launching game...";
          runGame(defaultProjectData);
        } else {
          statusEl.textContent = "Project loaded from Firebase!";
          runGame(docSnap.data());
        }
      } catch (error) {
        console.error("Firestore read/write error:", error);
        statusEl.textContent = "Database error. Playing local backup...";
        runGame(defaultProjectData);
      }
    }

    // Engine Render Loop
    function runGame(projectData) {
      const canvas = document.getElementById("game-canvas");
      scene = new THREE.Scene();
      scene.background = new THREE.Color(projectData.bgColor || 0x111111);

      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;

      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);

      const geometry = new THREE.BoxGeometry();
      const material = new THREE.MeshBasicMaterial({ color: projectData.playerColor || 0x00ff00 });
      playerMesh = new THREE.Mesh(geometry, material);
      scene.add(playerMesh);

      function animate() {
        requestAnimationFrame(animate);
        playerMesh.rotation.x += 0.01;
        playerMesh.rotation.y += 0.01;
        renderer.render(scene, camera);
      }
      animate();
    }

    window.addEventListener("resize", () => {
      if (camera && renderer) {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }
    });
  </script>
</body>
</html>
